# Catálogo de alvos de limpeza — Linux (caminhos XDG padrão).
# Mesmo formato de windows.toml. `~` e `${VAR}` são expandidos.
# Regras que exigem root (journal, cache do apt/dnf) ficam fora até existir
# o helper elevado (polkit): sem ele a remoção falharia com permissão negada.

[[exclusion]]
pattern = '~/.claude/projects'
reason = "histórico de conversa do Claude Code"
reason_en = "Claude Code conversation history"

[[exclusion]]
pattern = '~/.codex/sessions'
reason = "histórico de conversa do Codex"
reason_en = "Codex conversation history"

[[exclusion]]
pattern = '~/.local/share/flatpak'
reason = "apps Flatpak instalados; usar 'flatpak uninstall --unused'"
reason_en = "installed Flatpak apps; use 'flatpak uninstall --unused'"

# ------------------------------------------------------------------ tier A

[[rule]]
id = "npm-cache"
label = "npm cache"
tier = "A"
risk = "none"
note = "comando oficial"
note_en = "official command"
kind = "command"
command = "npm cache clean --force"
measure = '~/.npm/_cacache'

[[rule]]
id = "pip-cache"
label = "pip cache"
tier = "A"
risk = "none"
note = "comando oficial"
note_en = "official command"
kind = "command"
command = "pip cache purge"
measure = '~/.cache/pip'

[[rule]]
id = "yarn-cache"
label = "Yarn cache"
tier = "A"
risk = "none"
kind = "command"
command = "yarn cache clean"
measure = '~/.cache/yarn'

[[rule]]
id = "pnpm-store"
label = "pnpm store"
tier = "A"
risk = "none"
note = "remove só pacotes não referenciados"
note_en = "removes unreferenced packages only"
kind = "command"
command = "pnpm store prune"
measure = '~/.local/share/pnpm/store'

[[rule]]
id = "cargo-registry-cache"
label = "Cargo registry cache"
tier = "A"
risk = "none"
note = "só os .crate baixados; o índice fica"
note_en = "downloaded .crate files only; the index stays"
kind = "path"
path = '~/.cargo/registry/cache'

[[rule]]
id = "go-build-cache"
label = "Go build cache"
tier = "A"
risk = "none"
note = "comando oficial"
note_en = "official command"
kind = "command"
command = "go clean -cache"
measure = '~/.cache/go-build'

[[rule]]
id = "thumbnails"
label = "Miniaturas"
label_en = "Thumbnails"
tier = "A"
risk = "none"
note = "regeneradas pelo gerenciador de arquivos"
note_en = "regenerated by the file manager"
kind = "path"
path = '~/.cache/thumbnails'

[[rule]]
id = "chrome-cache"
label = "Chrome — cache"
tier = "A"
risk = "none"
kind = "path"
path = '~/.cache/google-chrome'

[[rule]]
id = "chromium-cache"
label = "Chromium — cache"
tier = "A"
risk = "none"
kind = "path"
path = '~/.cache/chromium'

[[rule]]
id = "firefox-cache"
label = "Firefox — cache"
tier = "A"
risk = "none"
kind = "path"
path = '~/.cache/mozilla'

[[rule]]
id = "vscode-vsix"
label = "VS Code — VSIX em cache"
label_en = "VS Code — cached VSIX"
tier = "A"
risk = "none"
note = ".vsix de extensões já instaladas"
note_en = ".vsix of extensions already installed"
kind = "path"
path = '~/.config/Code/CachedExtensionVSIXs'

[[rule]]
id = "vscode-cached-data"
label = "VS Code — CachedData"
tier = "A"
risk = "none"
kind = "path"
path = '~/.config/Code/CachedData'

[[rule]]
id = "trash"
label = "Lixeira"
label_en = "Trash"
tier = "A"
risk = "low"
note = "confirmar com o usuário: é o último lugar dos arquivos apagados"
note_en = "confirm with the user: it is the last place of deleted files"
kind = "path"
path = '~/.local/share/Trash/files'

# ------------------------------------------------------------------ tier C

[[rule]]
id = "gradle-caches"
label = "Gradle caches"
tier = "C"
risk = "redownload"
note = "rodar 'gradle --stop' antes; o daemon segura arquivos"
note_en = "run 'gradle --stop' first; the daemon holds files"
kind = "path"
path = '~/.gradle/caches'
watch_env = ["GRADLE_USER_HOME"]

[[rule]]
id = "gradle-wrapper"
label = "Gradle wrapper (distribuições)"
label_en = "Gradle wrapper (distributions)"
tier = "C"
risk = "redownload"
kind = "path"
path = '~/.gradle/wrapper'

[[rule]]
id = "maven-repository"
label = "Maven repository"
tier = "C"
risk = "redownload"
note = "re-baixado no próximo mvn"
note_en = "downloaded again on the next mvn run"
kind = "path"
path = '~/.m2/repository'

[[rule]]
id = "huggingface-cache"
label = "HuggingFace cache"
tier = "C"
risk = "redownload"
note = "modelos re-baixados sob demanda"
note_en = "models downloaded again on demand"
kind = "path"
path = '~/.cache/huggingface'
watch_env = ["HF_HOME", "HUGGINGFACE_HUB_CACHE"]

[[rule]]
id = "jetbrains-cache"
label = "JetBrains — caches"
tier = "C"
risk = "redownload"
note = "índices dos IDEs, reconstruídos ao abrir o projeto"
note_en = "IDE indexes, rebuilt when the project opens"
kind = "path"
path = '~/.cache/JetBrains'

# ------------------------------------------------------------------ projetos
# Pastas onde procurar projetos (as inexistentes são ignoradas; o usuário
# soma outras nas Configurações). Cada [[project]] reconhece a raiz por um
# marcador e oferece os artefatos regeneráveis dela como candidatos do tier C.

[[project_root]]
path = '~/workspace'

[[project_root]]
path = '~/projects'

[[project_root]]
path = '~/dev'

[[project_root]]
path = '~/src'

[[project_root]]
path = '~/code'

[[project]]
id = "node"
label = "Node.js"
markers = ["package.json"]
artifacts = ["node_modules", ".next", ".nuxt", ".turbo", ".parcel-cache"]
note = "npm/pnpm/yarn install recria"
note_en = "npm/pnpm/yarn install recreates it"

[[project]]
id = "rust"
label = "Rust"
markers = ["Cargo.toml"]
artifacts = ["target"]
note = "cargo build recria"
note_en = "cargo build recreates it"

[[project]]
id = "python"
label = "Python"
markers = ["pyproject.toml", "requirements.txt", "setup.py"]
artifacts = [".venv", "venv", ".tox", ".mypy_cache", ".pytest_cache"]
note = "recriar o ambiente (pip/uv) antes de usar"
note_en = "recreate the environment (pip/uv) before use"

[[project]]
id = "gradle"
label = "Gradle"
markers = ["settings.gradle", "settings.gradle.kts", "build.gradle", "build.gradle.kts"]
artifacts = ["build", ".gradle"]
note = "gradle build recria"
note_en = "gradle build recreates it"

[[project]]
id = "maven"
label = "Maven"
markers = ["pom.xml"]
artifacts = ["target"]
note = "mvn package recria"
note_en = "mvn package recreates it"

[[project]]
id = "dotnet"
label = ".NET"
markers = ["*.csproj", "*.fsproj", "*.sln"]
artifacts = ["bin", "obj"]
note = "dotnet build recria"
note_en = "dotnet build recreates it"
