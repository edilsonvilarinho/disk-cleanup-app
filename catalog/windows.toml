# Catálogo de alvos de limpeza — Windows.
# Portado de .claude/skills/disk-cleanup/references/catalog.md.
#
# Cada [[rule]] é um CANDIDATO A VERIFICAR, não uma ordem de execução.
#   tier      A (cache) | B (desinstalar) | C (regenerável) | D (sistema)
#   risk      none | low | redownload | long-running
#   kind      path    -> remove `path`
#             command -> executa `command`; o ganho é medido em `measure`
#   watch_env variáveis que, apontando para o alvo, o bloqueiam (pitfall #5)
#   label/note em português; label_en/note_en em inglês (ausente = igual)
#
# Fora desta versão: tier B (desinstaladores), DISM, %TEMP% com filtro de
# idade, Android SDK/NDK (devem sair via sdkmanager).

[[exclusion]]
pattern = '%USERPROFILE%\.claude\projects'
reason = "histórico de conversa do Claude Code"
reason_en = "Claude Code conversation history"

[[exclusion]]
pattern = '%USERPROFILE%\.codex\sessions'
reason = "histórico de conversa do Codex"
reason_en = "Codex conversation history"

# ------------------------------------------------------------------ tier A

[[rule]]
id = "npm-cache"
label = "npm cache"
tier = "A"
risk = "none"
note = "comando oficial; não apagar a pasta inteira"
note_en = "official command; do not delete the whole folder"
kind = "command"
command = "npm cache clean --force"
measure = '%LOCALAPPDATA%\npm-cache'

[[rule]]
id = "pip-cache"
label = "pip cache"
tier = "A"
risk = "none"
note = "comando oficial"
note_en = "official command"
kind = "command"
command = "pip cache purge"
measure = '%LOCALAPPDATA%\pip\cache'

[[rule]]
id = "yarn-cache"
label = "Yarn cache"
tier = "A"
risk = "none"
kind = "command"
command = "yarn cache clean"
measure = '%LOCALAPPDATA%\Yarn\Cache'

[[rule]]
id = "pnpm-store"
label = "pnpm store"
tier = "A"
risk = "none"
note = "remove só pacotes não referenciados"
note_en = "removes unreferenced packages only"
kind = "command"
command = "pnpm store prune"
measure = '%LOCALAPPDATA%\pnpm\store'

[[rule]]
id = "nuget-packages"
label = "NuGet packages"
tier = "A"
risk = "none"
kind = "command"
command = "dotnet nuget locals all --clear"
measure = '%USERPROFILE%\.nuget\packages'

[[rule]]
id = "cargo-registry-cache"
label = "Cargo registry cache"
tier = "A"
risk = "none"
note = "só os .crate baixados; o índice fica"
note_en = "downloaded .crate files only; the index stays"
kind = "path"
path = '%USERPROFILE%\.cargo\registry\cache'

[[rule]]
id = "electron-builder-cache"
label = "electron-builder cache"
tier = "A"
risk = "none"
kind = "path"
path = '%LOCALAPPDATA%\electron-builder\Cache'

[[rule]]
id = "electron-cache"
label = "Electron cache"
tier = "A"
risk = "none"
kind = "path"
path = '%LOCALAPPDATA%\electron\Cache'

[[rule]]
id = "vscode-vsix"
label = "VS Code — VSIX em cache"
label_en = "VS Code — cached VSIX"
tier = "A"
risk = "none"
note = ".vsix de extensões já instaladas"
note_en = ".vsix of extensions already installed"
kind = "path"
path = '%APPDATA%\Code\CachedExtensionVSIXs'

[[rule]]
id = "vscode-cached-data"
label = "VS Code — CachedData"
tier = "A"
risk = "none"
kind = "path"
path = '%APPDATA%\Code\CachedData'

[[rule]]
id = "chrome-ondevice-model"
label = "Chrome — modelo on-device"
label_en = "Chrome — on-device model"
tier = "A"
risk = "none"
note = "re-baixado pelo Chrome"
note_en = "downloaded again by Chrome"
kind = "path"
path = '%LOCALAPPDATA%\Google\Chrome\User Data\OptGuideOnDeviceModel'

[[rule]]
id = "chrome-shader-cache"
label = "Chrome — ShaderCache"
tier = "A"
risk = "none"
kind = "path"
path = '%LOCALAPPDATA%\Google\Chrome\User Data\ShaderCache'

[[rule]]
id = "nvidia-dxcache"
label = "NVIDIA DXCache"
tier = "A"
risk = "none"
note = "arquivos abertos pelo driver podem ficar (resíduo de MB)"
note_en = "files held by the driver may stay (MB of leftovers)"
kind = "path"
path = '%LOCALAPPDATA%\NVIDIA\DXCache'

[[rule]]
id = "nvidia-glcache"
label = "NVIDIA GLCache"
tier = "A"
risk = "none"
kind = "path"
path = '%LOCALAPPDATA%\NVIDIA\GLCache'

[[rule]]
id = "crash-dumps"
label = "Crash dumps"
tier = "A"
risk = "none"
note = "só servem para depurar crash"
note_en = "only useful to debug a crash"
kind = "path"
path = '%LOCALAPPDATA%\CrashDumps'

[[rule]]
id = "wer-user"
label = "Relatórios de erro (usuário)"
label_en = "Error reports (user)"
tier = "A"
risk = "none"
kind = "path"
path = '%LOCALAPPDATA%\Microsoft\Windows\WER'

[[rule]]
id = "wer-system"
label = "Relatórios de erro (sistema)"
label_en = "Error reports (system)"
tier = "A"
risk = "none"
note = "requer administrador"
note_en = "requires administrator"
kind = "path"
path = '%PROGRAMDATA%\Microsoft\Windows\WER'

[[rule]]
id = "windows-update-download"
label = "Windows Update — Download"
tier = "A"
risk = "none"
note = "remover com o serviço wuauserv parado; requer administrador"
note_en = "remove with the wuauserv service stopped; requires administrator"
kind = "path"
path = '%SystemRoot%\SoftwareDistribution\Download'

[[rule]]
id = "delivery-optimization"
label = "Delivery Optimization"
tier = "A"
risk = "none"
note = "requer administrador"
note_en = "requires administrator"
kind = "path"
path = '%SystemRoot%\SoftwareDistribution\DeliveryOptimization'

[[rule]]
id = "ollama-updates"
label = "Ollama — updates"
tier = "A"
risk = "none"
note = "binários de atualização antigos"
note_en = "old update binaries"
kind = "path"
path = '%LOCALAPPDATA%\Ollama\updates_v2'

[[rule]]
id = "discord-cache"
label = "Discord — Cache"
tier = "A"
risk = "none"
kind = "path"
path = '%APPDATA%\discord\Cache'

[[rule]]
id = "discord-code-cache"
label = "Discord — Code Cache"
tier = "A"
risk = "none"
kind = "path"
path = '%APPDATA%\discord\Code Cache'

[[rule]]
id = "onedrive-temp"
label = "OneDriveTemp"
tier = "A"
risk = "none"
kind = "path"
path = '%SystemDrive%\OneDriveTemp'

# ------------------------------------------------------------------ tier C

[[rule]]
id = "gradle-caches"
label = "Gradle caches"
tier = "C"
risk = "redownload"
note = "rodar 'gradle --stop' antes; o daemon segura arquivos"
note_en = "run 'gradle --stop' first; the daemon holds files"
kind = "path"
path = '%USERPROFILE%\.gradle\caches'
watch_env = ["GRADLE_USER_HOME"]

[[rule]]
id = "gradle-wrapper"
label = "Gradle wrapper (distribuições)"
label_en = "Gradle wrapper (distributions)"
tier = "C"
risk = "redownload"
kind = "path"
path = '%USERPROFILE%\.gradle\wrapper'

[[rule]]
id = "maven-repository"
label = "Maven repository"
tier = "C"
risk = "redownload"
note = "re-baixado no próximo mvn"
note_en = "downloaded again on the next mvn run"
kind = "path"
path = '%USERPROFILE%\.m2\repository'

[[rule]]
id = "nvidia-ngx-models"
label = "NVIDIA NGX models"
tier = "C"
risk = "redownload"
note = "re-baixado pela NVIDIA App"
note_en = "downloaded again by the NVIDIA App"
kind = "path"
path = '%PROGRAMDATA%\NVIDIA\NGX\models'

[[rule]]
id = "nvidia-app-update-framework"
label = "NVIDIA App — UpdateFramework"
tier = "C"
risk = "redownload"
note = "payloads de driver antigos"
note_en = "old driver payloads"
kind = "path"
path = '%PROGRAMDATA%\NVIDIA Corporation\NVIDIA app\UpdateFramework'

[[rule]]
id = "huggingface-cache"
label = "HuggingFace cache"
tier = "C"
risk = "redownload"
note = "modelos re-baixados sob demanda"
note_en = "models downloaded again on demand"
kind = "path"
path = '%USERPROFILE%\.cache\huggingface'
watch_env = ["HF_HOME", "HUGGINGFACE_HUB_CACHE"]

# ------------------------------------------------------------------ projetos
# Pastas onde procurar projetos (as inexistentes são ignoradas; o usuário
# soma outras nas Configurações). Cada [[project]] reconhece a raiz por um
# marcador e oferece os artefatos regeneráveis dela como candidatos do tier C.

[[project_root]]
path = '%USERPROFILE%\source\repos'

[[project_root]]
path = '%USERPROFILE%\workspace'

[[project_root]]
path = '%USERPROFILE%\projects'

[[project_root]]
path = '%USERPROFILE%\dev'

[[project_root]]
path = '%USERPROFILE%\Documents\GitHub'

[[project]]
id = "node"
label = "Node.js"
markers = ["package.json"]
artifacts = ["node_modules", ".next", ".nuxt", ".turbo", ".parcel-cache"]
note = "npm/pnpm/yarn install recria"
note_en = "npm/pnpm/yarn install recreates it"

[[project]]
id = "rust"
label = "Rust"
markers = ["Cargo.toml"]
artifacts = ["target"]
note = "cargo build recria"
note_en = "cargo build recreates it"

[[project]]
id = "python"
label = "Python"
markers = ["pyproject.toml", "requirements.txt", "setup.py"]
artifacts = [".venv", "venv", ".tox", ".mypy_cache", ".pytest_cache"]
note = "recriar o ambiente (pip/uv) antes de usar"
note_en = "recreate the environment (pip/uv) before use"

[[project]]
id = "gradle"
label = "Gradle"
markers = ["settings.gradle", "settings.gradle.kts", "build.gradle", "build.gradle.kts"]
artifacts = ["build", ".gradle"]
note = "gradle build recria"
note_en = "gradle build recreates it"

[[project]]
id = "maven"
label = "Maven"
markers = ["pom.xml"]
artifacts = ["target"]
note = "mvn package recria"
note_en = "mvn package recreates it"

[[project]]
id = "dotnet"
label = ".NET"
markers = ["*.csproj", "*.fsproj", "*.sln"]
artifacts = ["bin", "obj"]
note = "dotnet build recria"
note_en = "dotnet build recreates it"
