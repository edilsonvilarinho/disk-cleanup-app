<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu 04 · Cartão de status — Disk Cleanup</title>
<script>(function(){var m;try{m=localStorage.getItem('dc-theme-mode')}catch(e){}if(!m||m==='system')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',m)})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../apps/desktop/src/styles/app.css">
<link rel="stylesheet" href="menu-kit.css">
<style>
  .sidebar { gap: 24px; }
  .status {
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden;
    transition: border-color 0.2s ease, box-shadow 0.25s ease;
  }
  .status[data-open="true"] { border-color: var(--border-strong); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14); }
  .status-head {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px; border: 0; background: transparent;
    cursor: pointer; text-align: left;
  }
  .status-head:hover { background: var(--hover); }
  .beacon { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; transition: background 0.3s ease; }
  .beacon::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: ping 2.2s cubic-bezier(0, 0, 0.2, 1) infinite; }
  body.is-scanning .beacon { background: var(--info); }
  body.is-scanning .beacon::after { animation-duration: 1.1s; }
  .status-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .status-txt b { font-size: 13px; }
  .status-txt .mono { font-size: 11.5px; color: var(--muted); }
  .status .chev { color: var(--muted); transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1); }
  .status[data-open="true"] .chev { transform: rotate(180deg); }
  .status-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.32s cubic-bezier(0.4, 0, 0.2, 1); }
  .status[data-open="true"] .status-body { grid-template-rows: 1fr; }
  .status-body > div { overflow: hidden; }
  .status-rows { display: flex; flex-direction: column; gap: 8px; padding: 4px 12px 12px; font-size: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
  .status-upd { display: none; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); font-size: 12px; }
  body.has-update .status-upd { display: flex; animation: rise 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .status-upd .btn { min-height: 30px; padding: 0 10px; margin-left: auto; }
  .upd-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--info); }
  /* Order: status no rodapé, abrindo para cima */
  .status-wrap { display: flex; flex-direction: column-reverse; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><span data-icon="diskdot" data-size="18"></span></span>
      <div class="brand-text"><span class="brand-name">Disk Cleanup</span><span class="small muted">Limpeza com aprovação</span></div>
    </div>

    <nav class="nav" id="nav" aria-label="Seções">
      <a href="#" data-nav="cleanup"><span data-icon="disk"></span>Limpeza</a>
      <a href="#" data-nav="history"><span data-icon="history"></span>Histórico</a>
      <a href="#" data-nav="settings"><span data-icon="gear"></span>Configurações</a>
    </nav>

    <div class="spacer"></div>

    <section class="status" id="status" data-open="false" aria-label="Status do aplicativo">
      <div class="status-upd" role="status"><span class="upd-dot"></span><span>0.1.0-beta.6 disponível</span><button type="button" class="btn" data-toast="Download iniciado (simulado)">Baixar</button></div>
      <div class="status-body" id="status-body"><div><div class="status-rows">
        <div class="env-row"><span class="muted">Sistema</span><span>windows</span></div>
        <div class="env-row"><span class="muted">Catálogo</span><span>windows</span></div>
        <div class="env-row"><span class="muted">Modo</span><span style="font-weight:600">Aprovação explícita</span></div>
        <div class="env-row"><span class="muted">Versão</span><span class="mono">0.1.0-beta.5</span></div>
      </div></div></div>
      <button type="button" class="status-head" aria-expanded="false" aria-controls="status-body">
        <span class="beacon" aria-hidden="true"></span>
        <span class="status-txt"><b id="st-title">Pronto</b><span class="mono" id="st-sub">C:\ · somente leitura</span></span>
        <span class="chev" data-icon="chevup"></span>
      </button>
    </section>
  </aside>
  <main class="main"><div class="container" id="page"></div></main>
</div>
<script src="menu-kit.js"></script>
<script>
  DC.spec('<b>04 · Cartão de status</b> — ambiente, versão e atualização num só lugar, no rodapé.<ul>' +
    '<li>Fechado: farol + "Pronto · C:\\". Abre para cima com altura animada mostrando sistema, catálogo, modo e versão.</li>' +
    '<li>Farol muda para azul e acelera durante a varredura ("Varrendo C:\\"). Teste em Nova varredura.</li>' +
    '<li>Atualização entra como linha do próprio cartão (botão Atualização da moldura).</li>' +
    '<li>Topo do menu fica só com marca e seções.</li></ul>');
  DC.slider(document.getElementById('nav'));
  var st = document.getElementById('status'), head = st.querySelector('.status-head');
  head.addEventListener('click', function () {
    var open = st.getAttribute('data-open') !== 'true';
    st.setAttribute('data-open', String(open));
    head.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('dc:scan', function (e) {
    document.getElementById('st-title').textContent = e.detail.on ? 'Varrendo C:\\' : 'Pronto';
    document.getElementById('st-sub').textContent = e.detail.on ? 'leitura em andamento' : 'C:\\ · somente leitura';
  });
</script>
</body>
</html>
