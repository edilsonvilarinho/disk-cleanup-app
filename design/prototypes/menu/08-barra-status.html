<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu 08 · Barra de status — Disk Cleanup</title>
<script>(function(){var m;try{m=localStorage.getItem('dc-theme-mode')}catch(e){}if(!m||m==='system')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',m)})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../apps/desktop/src/styles/app.css">
<link rel="stylesheet" href="menu-kit.css">
<style>
  :root { --sb-h: 30px; }
  .layout { min-height: calc(100vh - var(--sb-h)); padding-bottom: var(--sb-h); }
  @media (min-width: 821px) { .layout > .sidebar { height: calc(100vh - var(--sb-h)); } }
  .sidebar { gap: 24px; }
  .statusbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; height: calc(var(--sb-h) + env(safe-area-inset-bottom, 0px));
    padding: 0 10px env(safe-area-inset-bottom, 0px); display: flex; align-items: center; gap: 2px;
    background: var(--surface); border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted);
    overflow-x: auto; white-space: nowrap; animation: sb-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  @keyframes sb-in { from { transform: translateY(100%); } }
  .sb-item { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 5px; border: 0; background: transparent; color: inherit; font-size: inherit; cursor: default; }
  button.sb-item { cursor: pointer; }
  button.sb-item:hover { background: var(--hover); color: var(--text); }
  .sb-sep { width: 1px; height: 14px; background: var(--border-strong); margin: 0 2px; flex: none; }
  .sb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); transition: background 0.3s ease; }
  body.is-scanning .sb-dot { background: var(--info); animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .sb-bar { width: 80px; height: 3px; display: none; }
  body.is-scanning .sb-bar { display: block; }
  .sb-item .shield { color: var(--ok); }
  .sb-upd { color: var(--info); font-weight: 600; }
  .sb-right { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .proto-bar { bottom: calc(var(--sb-h) + 12px + env(safe-area-inset-bottom, 0px)); }
  .proto-toast { bottom: calc(var(--sb-h) + 64px); }
  .tip-swap { display: inline-block; animation: swap 0.3s ease both; }
  @keyframes swap { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><span data-icon="diskdot" data-size="18"></span></span>
      <div class="brand-text"><span class="brand-name">Disk Cleanup</span><span class="small muted">Limpeza com aprovação</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Seções">
      <a href="#" data-nav="cleanup"><span data-icon="disk"></span>Limpeza</a>
      <a href="#" data-nav="history"><span data-icon="history"></span>Histórico</a>
      <a href="#" data-nav="settings"><span data-icon="gear"></span>Configurações</a>
    </nav>
  </aside>
  <main class="main"><div class="container" id="page"></div></main>
</div>

<footer class="statusbar" aria-label="Barra de status">
  <span class="sb-item" role="status" aria-live="polite"><span class="sb-dot" aria-hidden="true"></span><span id="sb-state" class="tip-swap">Pronto</span></span>
  <span class="indet sb-bar" aria-hidden="true"></span>
  <span class="sb-sep"></span>
  <span class="sb-item" title="Volume"><span data-icon="disk" data-size="13"></span><span class="mono">C:\</span></span>
  <span class="sb-item" title="Sistema e catálogo"><span data-icon="cpu" data-size="13"></span>windows</span>
  <span class="sb-item" title="Modo de execução"><span class="shield" data-icon="shield" data-size="13"></span>Aprovação explícita</span>
  <span class="sb-right">
    <button type="button" class="sb-item sb-upd when-update inline" data-toast="Download iniciado (simulado)"><span data-icon="download" data-size="13"></span>0.1.0-beta.6 disponível</button>
    <button type="button" class="sb-item" data-nav="settings" title="Atualizações em Configurações"><span class="mono">v0.1.0-beta.5</span></button>
  </span>
</footer>
<script src="menu-kit.js"></script>
<script>
  DC.spec('<b>08 · Barra de status</b> — padrão de IDE (VS Code, JetBrains).<ul>' +
    '<li>Barra lateral só com marca e seções. Ambiente, modo e versão descem para uma faixa de 30 px no rodapé da janela.</li>' +
    '<li>Estado vivo à esquerda: "Pronto" → "Varrendo C:\\" com mini barra indeterminada (teste em Nova varredura).</li>' +
    '<li>Atualização aparece como item clicável à direita; versão leva a Configurações.</li>' +
    '<li>Fica visível em qualquer tela, sem disputar espaço com o menu.</li></ul>');
  DC.slider(document.getElementById('nav'));
  document.addEventListener('dc:scan', function (e) {
    var s = document.getElementById('sb-state');
    s.textContent = e.detail.on ? 'Varrendo C:\\…' : 'Pronto';
    s.classList.remove('tip-swap'); void s.offsetWidth; s.classList.add('tip-swap');
  });
</script>
</body>
</html>
