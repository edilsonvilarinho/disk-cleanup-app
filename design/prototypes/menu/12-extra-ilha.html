<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu 12 · Extra · Ilha flutuante — Disk Cleanup</title>
<script>(function(){var m;try{m=localStorage.getItem('dc-theme-mode')}catch(e){}if(!m||m==='system')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',m)})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../apps/desktop/src/styles/app.css">
<link rel="stylesheet" href="menu-kit.css">
<style>
  /* FORA do system design: sem barra lateral, navegação em ilha no topo, acento colorido. */
  :root { --acc-1: #2F6FD6; --acc-2: #9B7BF0; }
  :root[data-theme="dark"] { --acc-1: #5B93EE; --acc-2: #9B7BF0; }
  .shell { min-height: 100vh; }
  .island-wrap { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 40; display: flex; justify-content: center; padding: 12px 16px 0; pointer-events: none; }
  .island {
    pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px;
    background: color-mix(in srgb, var(--surface) 82%, transparent); border: 1px solid var(--border-strong);
    backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5);
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.14); max-width: 100%; overflow-x: auto;
    transition: padding 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    animation: island-in 0.6s cubic-bezier(0.34, 1.3, 0.5, 1) both;
  }
  @keyframes island-in { from { transform: translateY(-30px) scale(0.9); opacity: 0; } }
  .compact .island { padding: 3px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12); transform: scale(0.96); }
  .logo { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; background: conic-gradient(from 200deg, var(--acc-1), var(--acc-2), var(--acc-1)); animation: spin-slow 12s linear infinite; }
  .logo > span { animation: spin-slow 12s linear infinite reverse; }
  @keyframes spin-slow { to { transform: rotate(360deg); } }
  .inav { position: relative; display: flex; gap: 2px; }
  .inav a {
    position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px;
    color: var(--muted); font-weight: 500; white-space: nowrap; transition: color 0.2s ease;
  }
  .inav a:hover { color: var(--text); }
  .inav a[aria-current="page"] { color: #fff; }
  .inav .nav-ind { border-radius: 999px; background: linear-gradient(135deg, var(--acc-1), var(--acc-2)); box-shadow: 0 6px 18px color-mix(in srgb, var(--acc-2) 35%, transparent); transition: transform 0.45s cubic-bezier(0.34, 1.3, 0.5, 1), width 0.45s cubic-bezier(0.34, 1.3, 0.5, 1), opacity 0.2s; }
  .chip {
    position: relative; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--border); font-size: 12px; color: var(--muted); white-space: nowrap; cursor: default;
  }
  .chip .ok-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  body.is-scanning .chip .ok-dot { background: var(--acc-1); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .chip-more { display: grid; grid-template-columns: 0fr; transition: grid-template-columns 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .chip-more > span { overflow: hidden; }
  .chip:hover .chip-more, .chip:focus-visible .chip-more { grid-template-columns: 1fr; }
  .upd { display: none; width: 34px; height: 34px; border-radius: 50%; border: 0; place-items: center; cursor: pointer; color: #fff; background: var(--acc-1); }
  body.has-update .upd { display: grid; animation: pop 0.35s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
  .main { padding-top: 24px; }
  .container { max-width: 1100px; }
  .btn-primary { background: linear-gradient(135deg, var(--acc-1), var(--acc-2)); border-color: transparent; color: #fff; }
  .meter > span { background: linear-gradient(90deg, var(--acc-1), var(--acc-2)); }
  @media (max-width: 640px) { .inav a .lbl, .chip-txt { display: none; } }
  @media (prefers-reduced-motion: reduce) { .logo, .logo > span { animation: none; } }
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="island-wrap">
    <header class="island">
      <span class="logo" title="Disk Cleanup v0.1.0-beta.5"><span data-icon="diskdot" data-size="16"></span></span>
      <nav class="inav" id="nav" aria-label="Seções">
        <a href="#" data-nav="cleanup"><span data-icon="disk"></span><span class="lbl">Limpeza</span></a>
        <a href="#" data-nav="history"><span data-icon="history"></span><span class="lbl">Histórico</span></a>
        <a href="#" data-nav="settings"><span data-icon="gear"></span><span class="lbl">Configurações</span></a>
      </nav>
      <span class="chip" tabindex="0" aria-label="Ambiente: windows, C:\, aprovação explícita">
        <span class="ok-dot" aria-hidden="true"></span><span class="mono chip-txt">C:\</span>
        <span class="chip-more"><span>· windows · Aprovação explícita · v0.1.0-beta.5</span></span>
      </span>
      <button type="button" class="upd" title="0.1.0-beta.6 disponível" data-toast="Download iniciado (simulado)"><span data-icon="download"></span></button>
    </header>
  </div>
  <main class="main"><div class="container" id="page"></div></main>
</div>
<script src="menu-kit.js"></script>
<script>
  DC.spec('<b>12 · Extra — Ilha flutuante</b> (foge do system design de propósito).<ul>' +
    '<li>Sem barra lateral: a navegação vira uma ilha no topo, com pílula em gradiente que desliza com mola.</li>' +
    '<li>Ambiente num chip que se expande no hover/foco; atualização vira um botão redondo que "pula" ao chegar.</li>' +
    '<li>Ao rolar, a ilha encolhe (menos sombra e padding). O conteúdo ganha a largura toda.</li>' +
    '<li><b>Custo:</b> 3 seções cabem; uma 4ª–5ª já aperta. Muda a regra "barra lateral = seções".</li></ul>');
  var move = DC.slider(document.getElementById('nav'));
  var shell = document.getElementById('shell');
  addEventListener('scroll', function () { shell.classList.toggle('compact', scrollY > 24); setTimeout(function () { move(true); }, 320); }, { passive: true });
</script>
</body>
</html>
