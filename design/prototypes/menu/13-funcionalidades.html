    document.querySelectorAll('#nav a').forEach(function (a) { if (a.getAttribute('data-sec') === f.sec) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    renderFlow(f);
    var page = document.getElementById('page');
    var y = window.scrollY;
    page.innerHTML = f.render();
    hydrate(page);
    var ex = document.getElementById('sb-extra');
    var nextScan = { daily: 'amanhã 09:00', weekly: 'dom 09:00', monthly: 'dia 1 09:00' }[S.mon.sched];
    ex.hidden = !(S.f === 10 && nextScan);
    ex.innerHTML = icon('history', 13) + 'Próxima varredura: ' + (nextScan || '');
    var pt = document.getElementById('pt'); if (pt) pt.textContent = String(S.f).padStart(2, '0') + ' · ' + f.short;
    if (soft) window.scrollTo(0, y);
    try { history.replaceState(null, '', '#' + S.f); } catch (e) {}
  }
  function go(n) { clearInterval(dupTimer); if (S.dup !== 'done') S.dup = 'idle'; busy(null); S.f = ((n - 1 + F.length) % F.length) + 1; render(false); window.scrollTo(0, 0); }

  document.addEventListener('click', function (e) {
    var el;
    if ((el = e.target.closest('[data-f]'))) return go(+el.getAttribute('data-f'));
    if ((el = e.target.closest('#nav a'))) { e.preventDefault(); var sec = el.getAttribute('data-sec'); var f = F.filter(function (x) { return x.sec === sec; })[0]; if (f) go(f.n); else toast('Histórico sem mudança nestas propostas'); return; }
    if ((el = e.target.closest('[data-dest]'))) { var p = el.getAttribute('data-dest').split(':'); S.dest[p[0]] = p[1]; return render(true); }
    if ((el = e.target.closest('[data-grp]'))) { var g = el.parentNode, o = g.getAttribute('data-open') !== 'true'; g.setAttribute('data-open', String(o)); el.setAttribute('aria-expanded', String(o)); return; }
    if ((el = e.target.closest('[data-dupg]'))) { var id = el.getAttribute('data-dupg'); S.dupOpen[id] = !S.dupOpen[id]; var b = el.parentNode; b.setAttribute('data-open', String(S.dupOpen[id])); el.setAttribute('aria-expanded', String(S.dupOpen[id])); return; }
    if ((el = e.target.closest('[data-tm]'))) { S.tm.push(+el.getAttribute('data-tm')); return render(true); }
    if ((el = e.target.closest('[data-crumb]'))) { S.tm = S.tm.slice(0, +el.getAttribute('data-crumb')); return render(true); }
    if ((el = e.target.closest('[data-act]'))) {
      var a = el.getAttribute('data-act');
      if (a === 'approve') {
        if (!S.ack) { var need = document.querySelector('[data-need="ack"]'); need.classList.remove('attn'); void need.offsetWidth; need.classList.add('attn'); need.querySelector('input').focus(); return; }
        toast('Plano aprovado · destino: ' + ['A', 'C', 'D'].map(function (t) { return t + ' ' + (S.dest[t] === 'trash' ? 'Lixeira' : 'definitivo'); }).join(' · '));
      } else if (a === 'dup-run') runDups();
      else if (a === 'dup-reset') { S.dup = 'idle'; S.keep = {}; S.dupOpen = {}; render(true); }
      else if (a === 'rule-add') { S.ruleErr = !S.ruleErr; render(true); }
      return;
    }
    if ((el = e.target.closest('[data-toast]'))) toast(el.getAttribute('data-toast'));
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-ack')) { S.ack = t.checked; render(true); }
    else if (t.hasAttribute('data-age')) { S.age = +t.value; render(true); }
    else if (t.hasAttribute('data-bigmin')) { S.big = +t.value; render(true); }
    else if (t.hasAttribute('data-big')) { S.bigSel[t.getAttribute('data-big')] = t.checked; render(true); }
    else if (t.hasAttribute('data-keep')) { var p = t.getAttribute('data-keep').split(':'); S.keep[p[0]] = +p[1]; render(true); }
    else if (t.hasAttribute('data-mon')) { S.mon.tray = t.checked; render(true); }
    else if (t.hasAttribute('data-thr')) { S.mon.thr = +t.value; render(true); }
    else if (t.hasAttribute('data-sched')) { S.mon.sched = t.value; render(true); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest('input,select,textarea')) return;
    if (e.key === 'ArrowRight') go(S.f + 1); else if (e.key === 'ArrowLeft') go(S.f - 1);
  });

  /* Barra do protótipo: índice, anterior/próxima e tema (atalho; no app o tema fica em Configurações). */
  function protoBar() {
    var bar = document.createElement('div');
    bar.className = 'proto-bar'; bar.setAttribute('aria-label', 'Controles do protótipo');
    bar.innerHTML = '<a href="index.html" title="Todos os protótipos">' + icon('grid', 14) + '</a>' +
      '<button type="button" id="pv" title="Proposta anterior (←)">' + icon('left', 14, 2) + '</button>' +
      '<span class="t" id="pt"></span>' +
      '<button type="button" id="pn" title="Próxima proposta (→)">' + icon('chevron', 14, 2) + '</button><span class="sep"></span>' +
      '<button type="button" id="pth" title="Atalho do protótipo: no app o tema fica em Configurações"></button>';
    document.body.appendChild(bar);
    document.getElementById('pv').onclick = function () { go(S.f - 1); };
    document.getElementById('pn').onclick = function () { go(S.f + 1); };
    var th = document.getElementById('pth');
    function syncTh() { var d = root.getAttribute('data-theme') === 'dark'; th.innerHTML = icon(d ? 'sun' : 'moon', 14) + '<span class="lbl">' + (d ? 'Claro' : 'Escuro') + '</span>'; }
    th.onclick = function () { var m = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', m); try { localStorage.setItem('dc-theme-mode', m); } catch (e) {} syncTh(); };
    syncTh();
  }

  document.addEventListener('DOMContentLoaded', function () {
    hydrate(document);
    protoBar();
    var h = +(location.hash || '').slice(1);
    S.f = h >= 1 && h <= F.length ? h : 1;
    render(false);
  });
})();
</script>
</body>
