<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu 11 · Extra · Vidro e aurora — Disk Cleanup</title>
<script>(function(){var m;try{m=localStorage.getItem('dc-theme-mode')}catch(e){}if(!m||m==='system')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',m)})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../apps/desktop/src/styles/app.css">
<link rel="stylesheet" href="menu-kit.css">
<style>
  /* FORA do system design: cor como atmosfera, vidro, brilho. */
  :root { --acc-1: #14A89A; --acc-2: #9B7BF0; --glass: rgba(255, 255, 255, 0.62); --glass-line: rgba(255, 255, 255, 0.7); }
  :root[data-theme="dark"] { --glass: rgba(18, 19, 24, 0.55); --glass-line: rgba(255, 255, 255, 0.08); }
  body { background: var(--bg); }
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(80px); opacity: 0.35; }
  :root[data-theme="dark"] .aurora i { opacity: 0.22; }
  .aurora i:nth-child(1) { background: var(--acc-1); left: -12vmax; top: -14vmax; animation: drift1 22s ease-in-out infinite alternate; }
  .aurora i:nth-child(2) { background: var(--acc-2); right: -14vmax; top: 18vh; animation: drift2 26s ease-in-out infinite alternate; }
  .aurora i:nth-child(3) { background: #E0559A; left: 30vw; bottom: -24vmax; opacity: 0.18; animation: drift1 30s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(14vmax, 10vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-12vmax, 14vmax) scale(0.9); } }
  .layout { position: relative; z-index: 1; }
  .card, .kpi, .flow { background: color-mix(in srgb, var(--surface) 78%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

  .sidebar {
    gap: 24px; margin: 12px; border-radius: 18px; border: 1px solid var(--glass-line);
    background: var(--glass); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
  }
  @media (min-width: 821px) { .layout > .sidebar { top: 12px; height: calc(100vh - 24px); } }
  .brand-mark { background: linear-gradient(135deg, var(--acc-1), var(--acc-2)); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--acc-2) 40%, transparent); }
  .nav-ind {
    background: linear-gradient(135deg, color-mix(in srgb, var(--acc-1) 16%, transparent), color-mix(in srgb, var(--acc-2) 16%, transparent));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc-2) 35%, transparent), 0 6px 20px color-mix(in srgb, var(--acc-2) 18%, transparent);
  }
  .nav a[aria-current="page"] [data-icon] { color: var(--acc-2); }
  .env { background: color-mix(in srgb, var(--surface) 40%, transparent); border-color: var(--glass-line); }
  .env .shield { color: var(--acc-1); }
  .btn-primary { background: linear-gradient(135deg, var(--acc-1), var(--acc-2)); border-color: transparent; color: #fff; }
  .meter > span, .track > span { background: linear-gradient(90deg, var(--acc-1), var(--acc-2)); }
  .update-notice { background: linear-gradient(135deg, color-mix(in srgb, var(--acc-1) 14%, var(--surface)), color-mix(in srgb, var(--acc-2) 14%, var(--surface))); border-color: transparent; }
  @media (prefers-reduced-motion: reduce) { .aurora i { animation: none; } }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><span data-icon="diskdot" data-size="18"></span></span>
      <div class="brand-text"><span class="brand-name">Disk Cleanup</span><span class="small muted mono">v0.1.0-beta.5</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Seções">
      <a href="#" data-nav="cleanup"><span data-icon="disk"></span>Limpeza</a>
      <a href="#" data-nav="history"><span data-icon="history"></span>Histórico</a>
      <a href="#" data-nav="settings"><span data-icon="gear"></span>Configurações</a>
    </nav>
    <div class="env">
      <span class="label-caps">Ambiente</span>
      <div class="env-row"><span class="muted">Sistema · catálogo</span><span>windows</span></div>
      <div class="env-row"><span class="muted">Volume</span><span class="mono">C:\</span></div>
      <div class="env-row"><span class="muted">Modo</span><span style="font-weight:600;display:inline-flex;gap:6px;align-items:center"><span class="shield" data-icon="shield" data-size="14"></span>Explícita</span></div>
    </div>
    <div class="spacer"></div>
    <div class="update-notice when-update" role="status"><span>Versão 0.1.0-beta.6 disponível</span><button type="button" class="btn" data-toast="Download iniciado (simulado)">Baixar</button></div>
  </aside>
  <main class="main"><div class="container" id="page"></div></main>
</div>
<script src="menu-kit.js"></script>
<script>
  DC.spec('<b>11 · Extra — Vidro e aurora</b> (foge do system design de propósito).<ul>' +
    '<li>Fundo com três manchas de cor (tons dos tiers A, B e D) que derivam devagar (22–30 s).</li>' +
    '<li>Barra lateral de vidro flutuante (desfoque + saturação), cantos de 18 px, sombra longa.</li>' +
    '<li>Acento em gradiente teal→violeta no item ativo, botão primário e barras.</li>' +
    '<li><b>Custo:</b> quebra "cor só para estado e categoria"; <span class="mono">backdrop-filter</span> pesa em WebKitGTK (Linux).</li></ul>');
  DC.slider(document.getElementById('nav'));
</script>
</body>
</html>
